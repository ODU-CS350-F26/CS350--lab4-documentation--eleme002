plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
    }
}

application {
    mainClass = 'edu.odu.cs.MostCommonWords'
}

// ---- Part 3: report generation ----

tasks.register('copyHtml', Copy) {
    from 'src/main/html'
    into layout.buildDirectory.dir('reports')
}

tasks.register('copyDocs', Copy) {
    dependsOn 'javadoc'
    from layout.buildDirectory.dir('docs')
    into layout.buildDirectory.dir('reports')
}

tasks.register('reports') {
    dependsOn 'build', 'copyHtml', 'copyDocs'
}

gitPublish {
    repoUri = 'https://github.com/ODU-CS350-F26/CS350--lab4-documentation--eleme002.git'
    branch = 'gh-pages'

    contents {
        from layout.buildDirectory.dir('reports')
    }
    commitMessage = 'Publish reports'
}

tasks.named('gitPublishCopy') {
    dependsOn 'reports'
}

tasks.register('deployReports') {
    dependsOn 'gitPublishPush'
}